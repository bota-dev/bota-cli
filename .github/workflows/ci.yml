name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Contract regressions
        run: npm test

      - name: Dependency licenses
        run: npm run license-check

      - name: Build and verify an installed package candidate
        run: npm run verify:package

      - name: Retain candidate and local qualification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-candidate-${{ github.sha }}
          path: |
            .release/*.tgz
            .release/package-receipt.json
            .release/consumer/*.json
          if-no-files-found: error
          include-hidden-files: true
