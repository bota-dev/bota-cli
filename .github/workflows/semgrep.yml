name: Semgrep

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Optional immutable 40-character commit SHA for a retrospective scan
        type: string
        required: false
        default: ''
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: sast-${{ github.event.pull_request.number || github.ref }}-${{ inputs.revision || 'current' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.168.0@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e
    env:
      SCANNER_IMAGE: semgrep/semgrep:1.168.0@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e
      RULE_PACKS: '["security-audit","owasp-top-ten","typescript","nodejs","github-actions"]'
    steps:
      - name: Validate retrospective revision
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_REVISION" && ! "$REQUESTED_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'revision must be a full immutable 40-character commit SHA' >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      - name: Trust the checked-out workspace for read-only Git analysis
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Snapshot community security rules and scan identity
        id: identity
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          SOURCE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_WORKFLOW_REF: ${{ github.workflow_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess, urllib.request
          from ruamel.yaml import YAML
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sast-evidence'
          policy = root / 'policy'
          policy.mkdir(parents=True, exist_ok=True)
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          requested = os.environ.get('REQUESTED_REVISION', '')
          if requested and actual.lower() != requested.lower():
              raise SystemExit('Checked-out commit does not match requested immutable revision')
          snapshots = []
          for pack in json.loads(os.environ['RULE_PACKS']):
              url = 'https://semgrep.dev/c/p/' + pack
              request = urllib.request.Request(url, headers={'User-Agent': 'bota-sast-rule-snapshot'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  body = response.read()
              document = YAML(typ='safe').load(body)
              if not isinstance(document.get('rules'), list) or not document['rules']:
                  raise SystemExit('Rule pack did not contain rules: ' + pack)
              path = policy / (pack + '.yaml')
              path.write_bytes(body)
              snapshots.append({'source': url, 'file': path.name, 'sha256': hashlib.sha256(body).hexdigest(), 'rules': len(document['rules'])})
          identity = {
              'repository': os.environ['GITHUB_REPOSITORY'], 'scanned_sha': actual,
              'requested_revision': requested or None, 'retrospective': bool(requested),
              'original_premerge_verification_claimed': False if requested else None,
              'event': os.environ['GITHUB_EVENT_NAME'], 'github_sha': os.environ['GITHUB_SHA'],
              'workflow_sha': os.environ['SOURCE_WORKFLOW_SHA'], 'workflow_ref': os.environ['SOURCE_WORKFLOW_REF'],
              'pr_head_sha': os.environ.get('PR_HEAD_SHA') or None, 'pr_base_sha': os.environ.get('PR_BASE_SHA') or None,
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'recorded_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'scanner_image': os.environ['SCANNER_IMAGE'],
              'scanner_version': subprocess.check_output(['semgrep', '--version'], text=True).strip(),
              'rule_snapshots': snapshots,
          }
          (root / 'identity.json').write_text(json.dumps(identity, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'scanned_sha': actual, 'retrospective': bool(requested), 'rule_packs': len(snapshots)}))
          PY

      - name: Run full repository security analysis
        id: analysis
        shell: bash
        run: |
          set -euo pipefail
          configs=()
          for config in "$RUNNER_TEMP/sast-evidence/policy/"*; do
            configs+=(--config="$config")
          done
          semgrep scan \
            --oss-only --strict --error --metrics=off --disable-version-check --no-rewrite-rule-ids \
            --jobs=2 --timeout=30 \
            --json-output "$RUNNER_TEMP/sast-evidence/results.json" \
            --sarif-output "$RUNNER_TEMP/sast-evidence/results.sarif" \
            "${configs[@]}" .

      - name: Record findings, errors and scanned file count
        if: ${{ always() && steps.identity.outcome == 'success' }}
        env:
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sast-evidence'
          report = json.loads((root / 'results.json').read_text(encoding='utf-8'))
          summary = {'analysis_outcome': os.environ['ANALYSIS_OUTCOME'], 'findings': len(report.get('results', [])), 'errors': len(report.get('errors', [])), 'scanned_files': len(report.get('paths', {}).get('scanned', [])), 'semgrep_version': report.get('version')}
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary))
          if not summary['scanned_files']:
              raise SystemExit('SAST scanned zero files; applicability needs a separate review')
          if summary['errors']:
              raise SystemExit('SAST reported analysis errors; evidence is incomplete')
          PY

      - name: Retain scan identity, exact rules and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sast-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sast-evidence/
          if-no-files-found: error
          retention-days: 90
