name: Update Bota harness

on:
  workflow_dispatch:
  schedule:
    - cron: '17 16 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bota-harness-update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || vars.BOTA_HARNESS_AUTO_UPDATE == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require read access to the private source
        env:
          HARNESS_READ_TOKEN: ${{ secrets.BOTA_HARNESS_READ_TOKEN }}
        run: |
          if [ -z "$HARNESS_READ_TOKEN" ]; then
            echo '::error::Set BOTA_HARNESS_READ_TOKEN with contents:read access to bota-dev/claude-code-plugins.'
            exit 1
          fi
      - name: Check out consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.BOTA_HARNESS_WRITE_TOKEN || github.token }}
      - name: Check out approved source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bota-dev/claude-code-plugins
          ref: main
          path: .bota-harness-upstream
          token: ${{ secrets.BOTA_HARNESS_READ_TOKEN }}
          persist-credentials: false
      - name: Generate and validate update
        run: |
          python3 .bota-harness-upstream/engineering-harness/bundle/harness.py sync --repo . --source .bota-harness-upstream --ref HEAD
          python3 scripts/bota-harness.py check --repo . --source .bota-harness-upstream
      - name: Open a reviewable update PR
        env:
          GH_TOKEN: ${{ secrets.BOTA_HARNESS_WRITE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(python3 -c 'import json; print(json.load(open("harness.lock.json"))["source"]["commit"])')
          branch="chore/bota-harness-${source_sha:0:12}"
          base=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')
          if [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --head "$branch" --json number --jq '.[].number')" ]; then
            echo 'An update PR for this source commit already exists; review that PR.'
            exit 0
          fi
          git add -- AGENTS.md harness.lock.json .bota-harness/common.md scripts/bota-harness.py .github/workflows/bota-harness.yml .github/workflows/bota-harness-update.yml
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          current = json.loads(Path('harness.lock.json').read_text())
          previous = json.loads(subprocess.check_output(['git', 'show', 'HEAD:harness.lock.json']))
          paths = sorted({item['target'] for lock in (current, previous) for item in lock['files'] if item['target'].startswith('.agents/skills/')})
          if paths:
              subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          if git diff --cached --quiet; then
            echo 'The consumer already uses the approved source commit.'
            exit 0
          fi
          git checkout -b "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update Bota harness to ${source_sha:0:12}"
          git push origin "$branch"
          body=$(mktemp)
          cat > "$body" <<EOF
          Update generated instructions, shared skills and harness tooling from bota-dev/claude-code-plugins@$source_sha.

          Validation: offline consistency and exact upstream-commit comparison passed. Repository guidance is preserved. This PR requires the repository's normal review and CI checks.
          EOF
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$base" --head "$branch" --title "chore: update Bota harness to ${source_sha:0:12}" --body-file "$body"
